name: Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          curl --silent --show-error --location --ipv4 --fail --user-agent "Mozilla/5.0" --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 --output GeoLite2-ASN.mmdb https://git.io/GeoLite2-ASN.mmdb
          curl --silent --show-error --location --ipv4 --fail --user-agent "Mozilla/5.0" --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 --output GeoLite2-City.mmdb https://git.io/GeoLite2-City.mmdb
          curl --silent --show-error --location --ipv4 --fail --user-agent "Mozilla/5.0" --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 --output GeoLite2-Country.mmdb https://git.io/GeoLite2-Country.mmdb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GeoLite2-ASN.mmdb
          git add GeoLite2-City.mmdb
          git add GeoLite2-Country.mmdb

          if [ "$(git log -1 --pretty=format:'%an')" = "github-actions[bot]" ]; then
            git commit --amend -m "Update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          else
            git commit --allow-empty -m "Update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          fi

          git push --force
